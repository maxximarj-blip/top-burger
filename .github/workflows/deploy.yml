name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Localizar o projeto
        run: |
          if [ -f package.json ]; then DIR=.; else
            ARQ=$(find . -name package.json -not -path "*/node_modules/*" | head -1)
            if [ -z "$ARQ" ]; then echo "::error::package.json não encontrado no repositório"; exit 1; fi
            DIR=$(dirname "$ARQ")
          fi
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"

      - name: Conferir as chaves do Supabase
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ] || [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Faltam os secrets VITE_SUPABASE_URL e/ou VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Instalar dependências
        working-directory: ${{ env.DIR }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Gerar o site
        working-directory: ${{ env.DIR }}
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
